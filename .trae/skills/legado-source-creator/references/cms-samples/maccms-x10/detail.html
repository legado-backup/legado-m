<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>视频详情 - 苹果CMS X10</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="/template/maccms10-php8/asset/css/module.css">
</head>
<body>
    <!-- 视频信息区域 -->
    <div class="container">
        <div class="module-info">
            <div class="module-info-cover">
                <img class="lazyload" data-src="https://example.com/detail-pic1.jpg" src="https://example.com/placeholder.jpg" alt="电影标题1">
            </div>
            <div class="module-info-heading">
                <h1 class="module-info-heading-title">电影标题1</h1>
                <div class="module-info-heading-sub">别名: 英文标题1</div>
            </div>
            <div class="module-info-main">
                <div class="module-info-item">
                    <span class="module-info-item-label">类型：</span>
                    <span class="module-info-item-content"><a href="/vodtype/1.html">电影</a></span>
                </div>
                <div class="module-info-item">
                    <span class="module-info-item-label">导演：</span>
                    <span class="module-info-item-content">张三</span>
                </div>
                <div class="module-info-item">
                    <span class="module-info-item-label">主演：</span>
                    <span class="module-info-item-content">李四 / 王五 / 赵六</span>
                </div>
                <div class="module-info-item">
                    <span class="module-info-item-label">地区：</span>
                    <span class="module-info-item-content">大陆</span>
                </div>
                <div class="module-info-item">
                    <span class="module-info-item-label">年份：</span>
                    <span class="module-info-item-content">2026</span>
                </div>
                <div class="module-info-item">
                    <span class="module-info-item-label">更新：</span>
                    <span class="module-info-item-content">2026-06-14</span>
                </div>
            </div>
            <div class="module-info-introduction">
                <div class="module-info-introduction-content">
                    <p>这是电影标题1的剧情简介，描述了一个精彩的故事...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 播放源标签页 -->
    <div class="container">
        <div class="module-heading">
            <h3 class="module-heading__title">播放线路</h3>
        </div>
        <div class="module-tab">
            <div class="module-tab-item tab-item active" data-dropdown-value="1">线路1</div>
            <div class="module-tab-item tab-item" data-dropdown-value="2">线路2</div>
        </div>

        <!-- 线路1 播放列表 -->
        <div class="module-play-list" style="display:block;">
            <div class="module-play-list-link">
                <a href="/vodplay/1-1-1.html">第1集</a>
                <a href="/vodplay/1-1-2.html">第2集</a>
                <a href="/vodplay/1-1-3.html">第3集</a>
                <a href="/vodplay/1-1-4.html">第4集</a>
                <a href="/vodplay/1-1-5.html">第5集</a>
                <a href="/vodplay/1-1-6.html">第6集</a>
            </div>
        </div>

        <!-- 线路2 播放列表 -->
        <div class="module-play-list" style="display:none;">
            <div class="module-play-list-link">
                <a href="/vodplay/1-2-1.html">第1集</a>
                <a href="/vodplay/1-2-2.html">第2集</a>
                <a href="/vodplay/1-2-3.html">第3集</a>
                <a href="/vodplay/1-2-4.html">第4集</a>
                <a href="/vodplay/1-2-5.html">第5集</a>
                <a href="/vodplay/1-2-6.html">第6集</a>
            </div>
        </div>
    </div>

</body>
</html>
