<!-- CMS Sample: maccms-v10 | Source: GitHub magicblack/maccms10 template/default/html/vod/play.html | Desensitized: 2026-06-14 -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>视频播放 - 苹果CMS V10</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="/template/default/asset/css/vod-play.css">
</head>
<body>
    <!-- 播放页容器 -->
    <div id="play_page">
        <div class="play_boxbg">
            <div class="container" style="margin-bottom: 0;">
                <div class="play_box play_video">
                    <div class="left_row fl">
                        <!-- 播放器区域（关键结构） -->
                        <div class="player_video embed-responsive embed-responsive-16by9 clearfix">
                            <!-- 当前播放提示 -->
                            <div id="fd_tips" class="fodong_box">
                                <div id="mq" class="fodong_tips">
                                    <a class="close_tips" href="javascript:void(0)"><i class="iconfont">&#xe616;</i></a>
                                    <ul>
                                        <li>当前播放：电影标题1 - 第1集</li>
                                    </ul>
                                </div>
                            </div>

                            <!-- 关键：player_aaaa 变量（苹果CMS标准播放数据注入方式） -->
                            <!-- 实际站点中，此变量由后端 PHP 模板引擎注入 -->
                            <script type="text/javascript">var player_aaaa = {"url":"https://example.com/video.m3u8","name":"第1集","flag":"play","id":101,"sid":1,"nid":1};</script>

                            <!-- 播放器 iframe（部分站点使用） -->
                            <!--
                            <iframe src="/player/dplayer.html" width="100%" height="100%" allowfullscreen="true" frameborder="0"></iframe>
                            -->
                        </div>

                        <!-- 播放操作栏 -->
                        <div class="play_but">
                            <div class="play-but-bar">
                                <div class="wrapper_fl play-but-wrap" id="playButScroll">
                                    <div class="scroller">
                                        <ul class="play-but-strip clearfix">
                                            <li class="play-but-item">
                                                <a href="javascript:void(0)" onclick="MAC.Gbook.Report('报错')">
                                                    <span>报错</span>
                                                </a>
                                            </li>
                                            <li class="play-but-item">
                                                <a href="javascript:;" onclick="location.reload()"><i class="iconfont">&#xe621;</i> 刷新</a>
                                            </li>
                                            <li class="play-but-item">
                                                <a href="/vod/play/id/101/sid/1/nid/0.html" class="btns_disad"><i class="iconfont pre-t">&#xe626;</i> 上集</a>
                                            </li>
                                            <li class="play-but-item">
                                                <a href="/vod/play/id/101/sid/1/nid/2.html"><span>下集</span> <i class="iconfont next-p next-t">&#xe62c;</i></a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 播放列表（与详情页结构一致） -->
                        <div class="pannel" id="bofy">
                            <div class="pannel_head pannel_head--vod-playlist">
                                <h3 class="title">播放列表</h3>
                                <div class="text_muted vod-playlist-head-sort">
                                    <a href="javascript:;" class="sort_btn">排序</a>
                                </div>
                            </div>
                            <div class="play_source">
                                <div class="play_source_tab list_scroll clearfix" id="NumTab">
                                    <a href="javascript:;" class="active" data-sid="1">播放源1</a>
                                    <a href="javascript:;" data-sid="2">播放源2</a>
                                </div>
                                <div class="stui-content__playlist clearfix">
                                    <div class="stui-content__playlist1" style="display:block;">
                                        <a href="/vod/play/id/101/sid/1/nid/1.html" class="active">第1集</a>
                                        <a href="/vod/play/id/101/sid/1/nid/2.html">第2集</a>
                                        <a href="/vod/play/id/101/sid/1/nid/3.html">第3集</a>
                                        <a href="/vod/play/id/101/sid/1/nid/4.html">第4集</a>
                                        <a href="/vod/play/id/101/sid/1/nid/5.html">第5集</a>
                                    </div>
                                    <div class="stui-content__playlist1" style="display:none;">
                                        <a href="/vod/play/id/101/sid/2/nid/1.html">第1集</a>
                                        <a href="/vod/play/id/101/sid/2/nid/2.html">第2集</a>
                                        <a href="/vod/play/id/101/sid/2/nid/3.html">第3集</a>
                                        <a href="/vod/play/id/101/sid/2/nid/4.html">第4集</a>
                                        <a href="/vod/play/id/101/sid/2/nid/5.html">第5集</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 用户行为日志标记（参考 GitHub play.html） -->
    <span style="display:none" class="mac_ulog_set" data-type="2" data-mid="1" data-id="101" data-sid="1" data-nid="1"></span>

    <!--
        苹果CMS V10 player_aaaa 变量说明：
        - url: 播放地址（m3u8/mp4/其他格式）
        - name: 当前集数名称
        - flag: 标记（通常为 "play"）
        - id: 视频ID
        - sid: 播放源序号
        - nid: 集数序号

        提取方式（Legado书源规则）：
        - js: JSON.parse(player_aaaa).url
        - 正则: player_aaaa.*?url":"(.*?)"
    -->

</body>
</html>
