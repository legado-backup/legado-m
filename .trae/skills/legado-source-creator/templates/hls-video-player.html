<!DOCTYPE html>
<!-- V2.20260606.1 -->
<!--
  Legado HLS.js 视频播放器模板
  作者: Miss光头强
  版本: V2.20260606.1
  
  使用方法：
  1. 在 ruleContent 中使用此模板
  2. 将 {{result}} 替换为实际视频地址（支持 m3u8/mp4）
  3. 将 {{videoTitle}} 替换为视频标题（可选，不提供则显示"视频播放"）
  4. 支持多视频地址（逗号或换行分隔）
  5. type 必须设置为 0（网页模式），不能用 type=2
  
  功能特性：
  - HLS.js 1.4.12 稳定版本
  - 视频标题显示（从网页提取或默认）
  - 进度条显示（播放进度+缓冲进度）
  - 快进快退（30秒/1分钟/3分钟）
  - 倍速播放（1x/3x/5x/10x/15x）
  - 全屏控制
  - 横竖屏反转（90°/180°/270°旋转）
  - 上下集切换（多视频时）
  - 错误自动重试
  - 响应式设计
  
  更新日志：
  V2.20260606.1 - 修复m3u8/mp4双重加载冲突；移除全局transition提升性能；修复事件监听器累积；删除无效srcchange事件；backdrop-filter兼容降级
  V2.20260301.5 - 新增横竖屏反转功能，支持90°/180°/270°旋转
  V2.20260301.4 - 优化布局：作者版本信息与显/隐按钮同行，居右显示
  V2.20260301.3 - 新增视频标题提取支持，{{videoTitle}} 模板变量
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 预解析常用域名 -->
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<link rel="dns-prefetch" href="//example.com">
<!-- HLS.js 1.4.12 稳定版本 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>

</head>
<body>
<div id="container">
  <h3 id="title">视频播放</h3>
  <div id="video-wrapper">
    <div class="video-progress-bar">
      <div class="video-buffer-progress" id="video-buffer-progress"></div>
      <div class="video-progress" id="video-progress"></div>
    </div>
    <video id="video-element" controls preload="auto" autoplay muted>
    </video>
  </div>
  <div id="video-url"></div>
  <div id="video-controls-bar">
    <button id="skip-3m">←3m</button>
    <button id="skip-1m">←1m</button>
    <button id="skip-30s">←30s</button>
    <button id="skip-plus30s">30s→</button>
    <button id="skip-plus1m">1m→</button>
    <button id="skip-plus3m">3m→</button>
    <select id="playback-rate-select">
      <option value="1.0">1x</option>
      <option value="3.0">3x</option>
      <option value="5.0">5x</option>
      <option value="10.0">10x</option>
      <option value="15.0">15x</option>
    </select>
    <button id="fullscreen-btn">全屏</button>
    <button id="rotate-btn">反转</button>
  </div>
  <div id="video-source-container" style="display: none;">
    <button id="prev-video-btn">上一集</button>
    <select id="video-source-select"></select>
    <button id="next-video-btn">下一集</button>
  </div>
  <div id="toggle-buttons">
    <button id="toggle-messages-btn">显/隐信息</button>
    <p id="author-info">©️ 作者: Miss光头强 | 版本: V2.20260606.1</p>
  </div>
  <div id="messages"></div>
  <div id="debug-info"></div>
  <div id="description"></div>
</div>

<script>
// 配置对象
const config = {
    skipIntroSeconds: 0, // 跳过片头的秒数
    showDescription: false, // 是否显示描述信息
    // HLS.js缓冲配置
    hlsJsConfig: {
        maxBufferLength: 180, // 最大缓冲长度（秒）
        maxMaxBufferLength: 600, // 最大最大缓冲长度（秒）
        maxBufferSize: 200 * 1024 * 1024, // 最大缓冲大小（200MB）
        startLevel: -1, // 自动选择适合带宽的质量级别
        maxBufferHole: 0.5, // 最大缓冲空洞（秒）
        highLatencyMode: false, // 低延迟模式
        liveSyncDuration: 30, // 直播同步时长
        liveMaxLatencyDuration: Infinity, // 直播最大延迟时长
        enableWorker: true, // 启用Web Worker
        enableSoftwareAES: true, // 启用软件AES解密
        backBufferLength: 180, // 后缓冲长度（秒）
        nudgeOffset: 0.1, // 微调偏移量
        nudgeMaxRetry: 3, // 微调最大重试次数
        maxFragLookUpTolerance: 0.25, // 最大片段查找容忍度
        enableWebVtt: true, // 启用WebVTT字幕
        enableCEA708Captions: true, // 启用CEA708字幕
        stretchShortVideoTrack: true, // 拉伸短视频轨道
        maxAudioFramesDrift: 1, // 最大音频帧漂移
        forceKeyFrameOnDiscontinuity: true, // 在不连续处强制关键帧
        startFragPrefetch: true, // 启用片段预加载
        capLevelToPlayerSize: false, // 不根据播放器大小限制码率，允许高质量
        maxMaxBufferHole: 1, // 最大最大缓冲空洞
        fragLoadingTimeOut: 20000, // 片段加载超时（毫秒）
        fragLoadingMaxRetry: 6, // 片段加载最大重试次数
        fragLoadingMaxRetryTimeout: 64000, // 片段加载最大重试超时
        fragLoadingRetryDelay: 1000, // 片段加载重试延迟
        levelLoadingTimeOut: 10000, // 级别加载超时
        levelLoadingMaxRetry: 4, // 级别加载最大重试次数
        levelLoadingRetryDelay: 1000, // 级别加载重试延迟
        manifestLoadingTimeOut: 10000, // 清单加载超时
        manifestLoadingMaxRetry: 3, // 清单加载最大重试次数
        manifestLoadingRetryDelay: 1000, // 清单加载重试延迟
        abr: {
            maxBitrate: Infinity, // 最大比特率
            minBitrate: 0, // 最小比特率
            defaultBitrate: 2000000, // 默认比特率（提升到2Mbps）
            bandwidthUpgradeTarget: 0.6, // 带宽升级目标（更激进升级）
            bandwidthDowngradeTarget: 0.3, // 带宽降级目标
            bandwidthDowngradeDelay: 5, // 带宽降级延迟（秒）
            bandwidthUpgradeDelay: 3, // 带宽升级延迟（秒）
            maxStarvationDelay: 2, // 最大饥饿延迟（秒）
            maxLoadingDelay: 2, // 最大加载延迟（秒）
            lowLatencyMode: false // 低延迟模式
        }
    }
};

let currentPlaybackRate = 1.0;
let hls = null;
let videoSources = [];

// 跳过片头的命名函数引用（避免匿名函数累积导致内存泄漏）
function onLoadedMetadataForSkip() {
  var ve = document.getElementById('video-element');
  if (ve.duration > config.skipIntroSeconds) {
    ve.currentTime = config.skipIntroSeconds;
    addMessage('✅ 已跳过 ' + config.skipIntroSeconds + ' 秒片头', 'success-message');
  }
  ve.removeEventListener('loadedmetadata', onLoadedMetadataForSkip);
}

// 加载视频（m3u8/mp4分流，避免双重加载冲突）
function loadVideo(url) {
  var ve = document.getElementById('video-element');

  // 清除旧的事件监听器（防止累积）
  ve.removeEventListener('timeupdate', updateProgressBar);
  ve.removeEventListener('loadedmetadata', updateProgressBar);
  ve.removeEventListener('progress', updateProgressBar);
  ve.removeEventListener('loadedmetadata', onLoadedMetadataForSkip);

  // 清除旧的HLS实例
  if (hls) {
    hls.destroy();
    hls = null;
  }

  ve.muted = true;
  ve.playbackRate = currentPlaybackRate;
  document.getElementById('video-url').textContent = '播放地址：' + url;

  // 根据视频类型分流加载
  if (isM3u8Format(url)) {
    // m3u8格式：优先使用HLS.js，不设直接src避免双重加载冲突
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls(config.hlsJsConfig);
      hls.attachMedia(ve);
      hls.loadSource(url);
      setupHlsEvents(hls);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        ve.play().catch(function(){});
      });
      addMessage('使用缓冲技术: HLS.js (v1.4.12)', 'success-message');
    } else if (ve.canPlayType('application/vnd.apple.mpegurl')) {
      // iOS Safari 等原生支持HLS的环境
      ve.src = url;
      ve.addEventListener('loadedmetadata', function onMeta() {
        ve.removeEventListener('loadedmetadata', onMeta);
        ve.play().catch(function(){});
      });
      addMessage('使用原生HLS播放', 'success-message');
    } else {
      addMessage('❌ 当前设备不支持HLS播放', 'error');
    }
  } else {
    // mp4等普通格式：直接设置src，走原生播放
    ve.src = url;
    ve.play().catch(function(){});
    addMessage('使用原生播放器', 'success-message');
  }

  // 重新添加进度条更新监听器
  ve.addEventListener('timeupdate', updateProgressBar);
  ve.addEventListener('loadedmetadata', updateProgressBar);
  ve.addEventListener('progress', updateProgressBar);

  // 跳过片头
  if (config.skipIntroSeconds > 0) {
    ve.addEventListener('loadedmetadata', onLoadedMetadataForSkip);
  }

  // 根据配置控制description显示状态
  if (config.showDescription) {
    document.getElementById('description').style.display = 'block';
  } else {
    document.getElementById('description').style.display = 'none';
  }
}

// 更新进度条
function updateProgressBar() {
  const videoElement = document.getElementById('video-element');
  const progressBar = document.getElementById('video-progress');
  const bufferProgressBar = document.getElementById('video-buffer-progress');
  if (!videoElement || !progressBar || !videoElement.duration) return;
  
  // 更新播放进度
  const progress = (videoElement.currentTime / videoElement.duration) * 100;
  progressBar.style.width = progress + '%';
  
  // 更新缓冲进度
  if (bufferProgressBar && videoElement.buffered.length > 0) {
    const bufferedEnd = videoElement.buffered.end(videoElement.buffered.length - 1);
    const bufferProgress = (bufferedEnd / videoElement.duration) * 100;
    bufferProgressBar.style.width = bufferProgress + '%';
  }
}

// 倍速播放控制
document.getElementById('playback-rate-select').onchange = function(){
  currentPlaybackRate = parseFloat(this.value);
  document.getElementById('video-element').playbackRate = currentPlaybackRate;
  addMessage(`视频倍速已设置为: ${currentPlaybackRate}x`);
};

// 快进快退功能
function skip(sec){
  const v = document.getElementById('video-element');
  const duration = v.duration || 0;
  const currentTime = v.currentTime || 0;
  const newTime = Math.max(0, Math.min(duration, currentTime + sec));
  v.currentTime = newTime;
  
  const action = sec > 0 ? '快进' : '后退';
  const absSeconds = Math.abs(sec);
  let timeText = '';
  if (absSeconds === 180) timeText = '3分钟';
  else if (absSeconds === 60) timeText = '1分钟';
  else if (absSeconds === 30) timeText = '30秒';
  else timeText = `${absSeconds}秒`;
  
  addMessage(`✅ 视频已${action} ${timeText}（当前时间：${Math.round(newTime)}秒）`, 'success-message');
}

// 全屏控制
function toggleFullscreen() {
  const videoElement = document.getElementById('video-element');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  
  if (!document.fullscreenElement) {
    // 进入全屏
    if (videoElement.requestFullscreen) {
      videoElement.requestFullscreen();
    } else if (videoElement.mozRequestFullScreen) {
      videoElement.mozRequestFullScreen();
    } else if (videoElement.webkitRequestFullscreen) {
      videoElement.webkitRequestFullscreen();
    } else if (videoElement.msRequestFullscreen) {
      videoElement.msRequestFullscreen();
    }
    fullscreenBtn.textContent = '退出全屏';
    addMessage('已进入全屏模式');
  } else {
    // 退出全屏
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.mozCancelFullScreen) {
      document.mozCancelFullScreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
    fullscreenBtn.textContent = '全屏';
    addMessage('已退出全屏模式');
  }
}

// 监听全屏状态变化
document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement) {
    document.getElementById('fullscreen-btn').textContent = '全屏';
  }
});
document.addEventListener('webkitfullscreenchange', function() {
  if (!document.webkitFullscreenElement) {
    document.getElementById('fullscreen-btn').textContent = '全屏';
  }
});
document.addEventListener('mozfullscreenchange', function() {
  if (!document.mozFullScreen) {
    document.getElementById('fullscreen-btn').textContent = '全屏';
  }
});
document.addEventListener('MSFullscreenChange', function() {
  if (!document.msFullscreenElement) {
    document.getElementById('fullscreen-btn').textContent = '全屏';
  }
});



// 视频反转控制（横竖屏切换）
let currentRotation = 0;  // 当前旋转角度：0, 90, 180, 270

function toggleRotation() {
  const videoWrapper = document.getElementById('video-wrapper');
  const videoElement = document.getElementById('video-element');
  const rotateBtn = document.getElementById('rotate-btn');
  
  // 旋转角度递增90度
  currentRotation = (currentRotation + 90) % 360;
  
  // 应用旋转变换
  videoWrapper.style.transform = `rotate(${currentRotation}deg)`;
  
  // 根据旋转角度调整宽高
  if (currentRotation === 90 || currentRotation === 270) {
    // 横屏模式：交换宽高
    videoWrapper.style.width = 'auto';
    videoWrapper.style.height = '100vw';
    videoWrapper.style.maxHeight = '60vh';
    videoElement.style.width = 'auto';
    videoElement.style.height = '100%';
  } else {
    // 正常模式：恢复原始宽高
    videoWrapper.style.width = '100%';
    videoWrapper.style.height = 'auto';
    videoWrapper.style.maxHeight = '';
    videoElement.style.width = '100%';
    videoElement.style.height = 'auto';
  }
  
  // 更新按钮文字
  const rotationText = currentRotation === 0 ? '正常' : 
                       currentRotation === 90 ? '横屏' : 
                       currentRotation === 180 ? '倒置' : '横屏';
  rotateBtn.textContent = rotationText;
  
  addMessage(`视频已旋转至 ${currentRotation}° (${rotationText}模式)`, 'success-message');
}

// 检测是否为m3u8格式
function isM3u8Format(url) {
  return url.toLowerCase().endsWith('.m3u8') || url.includes('m3u8');
}

// 设置HLS.js事件监听（从loadVideo调用，hls实例已创建）
function setupHlsEvents(hlsInstance) {
  hlsInstance.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
    addMessage('HLS.js: 播放列表解析完成，共' + data.levels.length + '个质量级别', 'success-message');
  });
  
  hlsInstance.on(Hls.Events.BUFFER_CREATED, function () {
    addMessage('HLS.js: 缓冲创建成功', 'success-message');
  });
  
  hlsInstance.on(Hls.Events.BUFFER_APPENDING, function (event, data) {
    if(data.frag.sn % 10 === 0){
      addMessage('HLS.js: 正在缓冲片段 ' + data.frag.sn, 'success-message');
    }
  });
  
  hlsInstance.on(Hls.Events.BUFFER_LEVEL_STATE_CHANGED, function (event, data) {
    addMessage('HLS.js: 缓冲状态变更: ' + data.level + ' (' + data.state + ')', 'success-message');
  });
  
  hlsInstance.on(Hls.Events.ERROR, function (event, data) {
    if (data.fatal) {
      switch (data.type) {
        case Hls.ErrorTypes.NETWORK_ERROR:
          addMessage('HLS.js: 网络错误，正在重试...', 'error');
          hlsInstance.startLoad();
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          addMessage('HLS.js: 媒体错误，正在重试...', 'error');
          hlsInstance.recoverMediaError();
          break;
        default:
          addMessage('HLS.js: 致命错误: ' + data.type, 'error');
          hlsInstance.destroy();
          hls = null;
          break;
      }
    } else {
      addMessage('HLS.js: 非致命错误: ' + data.type + ' - ' + data.details, 'warn');
    }
  });
}

// 添加消息
function addMessage(text, className = '') {
  const messagesDiv = document.getElementById('messages');
  const messageElement = document.createElement('div');
  if (className) {
    messageElement.className = className;
  }
  messageElement.textContent = text;
  messagesDiv.appendChild(messageElement);
  messagesDiv.appendChild(document.createElement('br'));
  // 滚动到底部
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// 切换显示/隐藏
function setupToggleButtons() {
  document.getElementById('toggle-messages-btn').onclick = function() {
    const messagesDiv = document.getElementById('messages');
    messagesDiv.style.display = messagesDiv.style.display === 'none' ? 'block' : 'none';
  };
}

// 更新视频源
function updateVideoSource() {
  const selectedIndex = parseInt(document.getElementById('video-source-select').value);
  if (isNaN(selectedIndex) || !videoSources[selectedIndex]) {
    addMessage('❌ 未找到有效的视频源', 'error');
    return;
  }
  const selectedSource = videoSources[selectedIndex];
  loadVideo(selectedSource);
  addMessage(`更新视频源为: ${selectedSource}`);
}

// 绑定事件监听器
function setupEventListeners() {
  // 快进快退按钮
  document.getElementById('skip-3m').onclick = () => skip(-180);
  document.getElementById('skip-1m').onclick = () => skip(-60);
  document.getElementById('skip-30s').onclick = () => skip(-30);
  document.getElementById('skip-plus30s').onclick = () => skip(30);
  document.getElementById('skip-plus1m').onclick = () => skip(60);
  document.getElementById('skip-plus3m').onclick = () => skip(180);
  
  // 全屏按钮
  document.getElementById('fullscreen-btn').onclick = toggleFullscreen;
  
  // 反转按钮（横竖屏切换）
  document.getElementById('rotate-btn').onclick = toggleRotation;
  
  // 视频源选择器
  document.getElementById('video-source-select').onchange = updateVideoSource;
  
  // 上一集按钮
  document.getElementById('prev-video-btn').onclick = function() {
    const currentVideoIndex = parseInt(document.getElementById('video-source-select').value);
    if (!isNaN(currentVideoIndex) && currentVideoIndex > 0) {
      document.getElementById('video-source-select').value = currentVideoIndex - 1;
      updateVideoSource();
    }
  };
  
  // 下一集按钮
  document.getElementById('next-video-btn').onclick = function() {
    const currentVideoIndex = parseInt(document.getElementById('video-source-select').value);
    if (!isNaN(currentVideoIndex) && currentVideoIndex < videoSources.length - 1) {
      document.getElementById('video-source-select').value = currentVideoIndex + 1;
      updateVideoSource();
    }
  };
}

// 视频标题（从 ruleContent 提取）
var videoTitle = "{{videoTitle}}";

// 初始化
function init() {
  // 设置事件监听器
  setupEventListeners();
  
  // 设置切换按钮
  setupToggleButtons();
  
  // 设置视频标题
  if (videoTitle && videoTitle !== "{{videoTitle}}" && videoTitle.trim() !== "") {
    document.getElementById('title').textContent = videoTitle;
  }
  
  let res="{{result}}";
  // 解析视频源
  if (typeof res !== 'undefined' && res) {
    // 支持逗号和回车分割的多个视频地址
    videoSources = res.split(/[,\n\r]/).map(url => url.trim()).filter(url => url);
    
    if (videoSources.length > 0) {
      // 填充视频选择器
      const videoSourceSelect = document.getElementById('video-source-select');
      videoSourceSelect.innerHTML = '';
      
      videoSources.forEach((url, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `视频 ${index + 1}`;
        videoSourceSelect.appendChild(option);
      });
      
      // 根据视频数量显示或隐藏视频源切换容器
      if (videoSources.length > 1) {
        document.getElementById('video-source-container').style.display = 'flex';
      } else {
        document.getElementById('video-source-container').style.display = 'none';
      }
      
      // 加载第一个视频
      loadVideo(videoSources[0]);
    } else {
      addMessage('❌ 未找到有效的视频地址', 'error');
    }
  } else {
    addMessage('❌ 未找到有效的视频地址', 'error');
  }
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', init);
</script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#121212;
    color:#e0e0e0;
    padding:8px;
    -webkit-tap-highlight-color:transparent;
}
#container{
    max-width:100%;
    margin:0 auto;
    padding:12px;
    background:#1e1e1e;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.4);
    border:1px solid #2d2d2d;
}
#title{
    margin:8px auto;
    font-size:18px;
    text-align:center;
    color:#f5f5f5;
    font-weight:500;
}
#video-element{
    width:100%;
    height:auto;
    border-radius:10px;
    background:#000;
    border:1px solid #333;
    touch-action:manipulation;
    user-select:none;
}
#video-wrapper{
    position:relative;
}
.video-progress-bar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.2);
    z-index:10;
    transition:opacity 0.3s;
}
.video-buffer-progress{
    height:100%;
    background:rgba(255,255,255,0.5);
    width:0;
    position:absolute;
    top:0;
    left:0;
}
.video-progress{
    height:100%;
    background:#4a9eff;
    width:0;
    position:absolute;
    top:0;
    left:0;
    transition:width 0.1s linear;
}
#video-url{
    background:#1a2b4a;
    padding:8px;
    border-radius:8px;
    margin:8px 0;
    font-size:13px;
    color:#8ab4f8;
    word-break:break-all;
    border:1px solid #2c3e50;
    text-align:center;
}
#video-controls-bar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:3px;
    margin:8px 0;
    padding:6px;
    border-radius:10px;
    background:rgba(45,45,45,0.95);
    border:1px solid rgba(60,60,60,0.5);
    flex-wrap:nowrap;
    overflow-x:auto;
    scrollbar-width:thin;
}
@supports (backdrop-filter:blur(1px)){
    #video-controls-bar{
        background:rgba(45,45,45,0.8);
        backdrop-filter:blur(8px);
        -webkit-backdrop-filter:blur(8px);
    }
}
#video-controls-bar button{
    min-width:40px;
    padding:3px 4px;
    font-size:11px;
    margin:0 2px;
    border-radius:6px;
    background:#333;
    color:#e0e0e0;
    border:1px solid #444;
    cursor:pointer;
}
#video-controls-bar select{
    min-width:48px;
    padding:3px 4px;
    font-size:11px;
    margin:0 2px;
    border-radius:6px;
    background:#333;
    color:#e0e0e0;
    border:1px solid #444;
}
button:hover,select:hover{
    background:#3d3d3d!important;
    border-color:#555!important;
}
button:active{
    background:#444!important;
    transform:scale(0.98);
    transition:transform 0.1s ease;
}
#video-controls-bar::-webkit-scrollbar{
    height:4px;
}
#video-controls-bar::-webkit-scrollbar-thumb{
    background:#555;
    border-radius:2px;
}
#video-controls-bar::-webkit-scrollbar-track{
    background:#222;
}
#description{
    width:100%;
    margin:8px auto;
    font-size:13px;
    text-align:left;
    word-wrap:break-word;
    white-space:pre-wrap;
    color:#d0d0d0;
    line-height:1.5;
    display:none;
}
#messages{
    width:100%;
    margin:8px auto;
    font-size:13px;
    text-align:left;
    word-wrap:break-word;
    white-space:pre-wrap;
    color:#d0d0d0;
    line-height:1.5;
    display:none;
}
#debug-info{
    width:100%;
    margin:8px auto;
    font-size:13px;
    text-align:left;
    word-wrap:break-word;
    white-space:pre-wrap;
    color:#d0d0d0;
    line-height:1.5;
    display:none;
}
#toggle-buttons{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:4px;
    margin:8px 0;
    flex-wrap:wrap;
}
#toggle-buttons button{
    padding:2px 6px;
    font-size:10px;
    border-radius:4px;
    background:#333;
    color:#e0e0e0;
    border:1px solid #444;
    cursor:pointer;
}
#author-info{
    font-size:9px;
    color:#888;
    text-align:right;
    margin:0;
    white-space:nowrap;
}
/* 视频源切换容器样式 */
#video-source-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:8px 0;
    padding:6px;
    border-radius:10px;
    background:rgba(45,45,45,0.95);
    border:1px solid rgba(60,60,60,0.5);
}
@supports (backdrop-filter:blur(1px)){
    #video-source-container{
        background:rgba(45,45,45,0.8);
        backdrop-filter:blur(8px);
        -webkit-backdrop-filter:blur(8px);
    }
}
#video-source-container button{
    min-width:40px;
    padding:3px 4px;
    font-size:11px;
    border-radius:6px;
    background:#333;
    color:#e0e0e0;
    border:1px solid #444;
    cursor:pointer;
}
#video-source-container select{
    min-width:120px;
    padding:3px 4px;
    font-size:11px;
    border-radius:6px;
    background:#333;
    color:#e0e0e0;
    border:1px solid #444;
}
/* 响应式设计 */
@media screen and (max-width: 768px) {
    body {
        padding: 4px;
        font-size: 14px;
    }
    #container {
        padding: 8px;
        border-radius: 8px;
    }
    #title {
        font-size: 16px;
    }
    #description {
        font-size: 12px;
    }
    #video-controls-bar {
        gap: 2px !important;
        padding: 4px;
    }
    #video-controls-bar button {
        min-width: 36px !important;
        font-size: 10px !important;
        padding: 2px 3px !important;
    }
    #video-controls-bar select {
        min-width: 44px !important;
        font-size: 10px !important;
    }
    #toggle-buttons button {
        font-size: 9px;
        padding: 2px 4px;
    }
    #author-info {
        font-size: 8px;
    }
    #video-source-container {
        gap: 4px !important;
        padding: 4px;
    }
    #video-source-container button {
        min-width: 36px !important;
        font-size: 10px !important;
        padding: 2px 3px !important;
    }
    #video-source-container select {
        min-width: 100px !important;
        font-size: 10px !important;
    }
}
/* 消息样式 */
.success-message {
    color: #4caf50 !important;
}
.warn {
    color: #ff9800 !important;
}
.error {
    color: #f44336 !important;
}

</style>
</body>
</html>
