<!DOCTYPE html>
<!-- V1.20260606.1 -->
<!--
  Legado 自动视频播放器模板
  作者: Miss光头强
  版本: V1.20260606.1

  使用方法：
  1. 在 ruleContent 中使用此模板，type 必须设置为 0（网页模式）
  2. 模板会自动从页面中抓取视频地址并播放
  3. 支持四种视频提取方法：DOM提取、正则提取、JS变量提取、XHR拦截提取
  4. 支持分页加载（列表模式/拼接模式）
  5. 支持自动加载/手动加载
  6. 支持视频源选择/上下集切换
  7. 支持进度条/快进快退/倍速/全屏

  模板变量（Legado 规则引擎替换）：
  - {{@@title@text||h1.0@text||h2.0@text||.title.0@text}}  → 视频标题
  - {{@@.pager@a.-2@textNodes##\n.*}}                      → 分页信息
  - {{@@.chapters@a@href}}                                  → 章节链接列表
  - {{@@.chapters@a@text}}                                  → 章节标题列表
  - {{@@.right@html||.info.0@html||.jianjie@html}}          → 描述信息
  - {{baseUrl}}                                              → 当前页面URL

  更新日志：
  V1.20260606.1 - 移除jQuery依赖(87KB)；AJAX改用Legado JSBridge；修复Lookbehind正则(Android5-7崩溃)；m3u8/mp4分流加载；事件监听器累积修复；删除srcchange死代码；移除全局transition；backdrop-filter兼容降级；URL去重增强；videoExtensionsToFilter重命名为adExtensionBlacklist；DOM提取选择器可配置化；新增XHR/Fetch拦截提取
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 预解析常用域名 -->
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<!-- HLS.js 1.4.12 稳定版本 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
</head>
<body>
<div id="container">
  <h3 id="title">{{@@title@text||h1.0@text||h2.0@text||.title.0@text}}</h3>
  <div id="video-wrapper">
    <div class="video-progress-bar">
      <div class="video-buffer-progress" id="video-buffer-progress"></div>
      <div class="video-progress" id="video-progress"></div>
    </div>
    <video id="video-element" controls preload="auto" autoplay muted>
    </video>
  </div>
  <div id="video-url"></div>
  <div id="video-controls-bar">
    <button id="skip-3m">←3m</button>
    <button id="skip-1m">←1m</button>
    <button id="skip-30s">←30s</button>
    <button id="skip-plus30s">30s→</button>
    <button id="skip-plus1m">1m→</button>
    <button id="skip-plus3m">3m→</button>
    <select id="playback-rate-select">
      <option value="1.0">1x</option>
      <option value="3.0">3x</option>
      <option value="5.0">5x</option>
      <option value="10.0">10x</option>
      <option value="15.0">15x</option>
    </select>
    <button id="fullscreen-btn">全屏</button>
    <button id="rotate-btn">反转</button>
  </div>
  <div id="video-source-container" style="display: none;">
    <button id="prev-video-btn">上一集</button>
    <select id="video-source-select"></select>
    <button id="next-video-btn">下一集</button>
  </div>
  <div id="page-controls" style="display: none;">
    <button id="prev-page-btn">上一页</button>
    <span id="page-info">1/1</span>
    <button id="next-page-btn">下一页</button>
    <button id="auto-load-btn">自动加载</button>
  </div>
  <div id="toggle-buttons">
    <button id="toggle-messages-btn">显/隐信息</button>
    <button id="toggle-debug-btn">调试信息</button>
    <p id="author-info">©️ 作者: Miss光头强 | 版本: V1.20260606.1</p>
  </div>
  <div id="messages"></div>
  <div id="debug-info"></div>
  <div id="description">{{@@.right@html||.info.0@html||.jianjie@html}}</div>
</div>

<script>
// ============================================================
// 配置对象
// ============================================================
var config = {
    skipIntroSeconds: 0,          // 跳过片头的秒数
    showDescription: false,       // 是否显示描述信息
    autoLoad: true,               // 是否自动加载视频
    // 广告后缀黑名单（mp4是因为某些网站用mp4播放广告，真正视频是m3u8）
    adExtensionBlacklist: ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp', '.svg', '.ico', '.css', '.js', '.mp4'],
    // 通用选择器（优先）
    genericSelectors: 'video, source, [src*=".m3u8"], [src*=".mp4"], [data-src*=".m3u8"]',
    // 站点特定选择器（可配置覆盖，如 '.playlist.wbox.ffm3u8 li a[title]'）
    siteSpecificSelector: '',
    // HLS.js缓冲配置
    hlsJsConfig: {
        maxBufferLength: 180,
        maxMaxBufferLength: 600,
        maxBufferSize: 200 * 1024 * 1024,
        startLevel: -1,
        maxBufferHole: 0.5,
        highLatencyMode: false,
        liveSyncDuration: 30,
        liveMaxLatencyDuration: Infinity,
        enableWorker: true,
        enableSoftwareAES: true,
        backBufferLength: 180,
        nudgeOffset: 0.1,
        nudgeMaxRetry: 3,
        maxFragLookUpTolerance: 0.25,
        enableWebVtt: true,
        enableCEA708Captions: true,
        stretchShortVideoTrack: true,
        maxAudioFramesDrift: 1,
        forceKeyFrameOnDiscontinuity: true,
        startFragPrefetch: true,
        capLevelToPlayerSize: false,
        maxMaxBufferHole: 1,
        fragLoadingTimeOut: 20000,
        fragLoadingMaxRetry: 6,
        fragLoadingMaxRetryTimeout: 64000,
        fragLoadingRetryDelay: 1000,
        levelLoadingTimeOut: 10000,
        levelLoadingMaxRetry: 4,
        levelLoadingRetryDelay: 1000,
        manifestLoadingTimeOut: 10000,
        manifestLoadingMaxRetry: 3,
        manifestLoadingRetryDelay: 1000,
        abr: {
            maxBitrate: Infinity,
            minBitrate: 0,
            defaultBitrate: 2000000,
            bandwidthUpgradeTarget: 0.6,
            bandwidthDowngradeTarget: 0.3,
            bandwidthDowngradeDelay: 5,
            bandwidthUpgradeDelay: 3,
            maxStarvationDelay: 2,
            maxLoadingDelay: 2,
            lowLatencyMode: false
        }
    }
};

// ============================================================
// 全局变量
// ============================================================
var currentPlaybackRate = 1.0;
var hls = null;
var videoSources = [];
var currentPage = 1;
var totalPages = 1;
var pageUrls = [];
var pageTitles = [];
var interceptedVideoUrls = [];
var currentRotation = 0;

// ============================================================
// XHR/Fetch 拦截提取（在页面加载前安装）
// ============================================================

// 判断是否为m3u8 URL
function isM3u8Url(url) {
    if (!url || typeof url !== 'string') return false;
    var lower = url.toLowerCase();
    return lower.indexOf('.m3u8') !== -1 || lower.indexOf('m3u8') !== -1;
}

// 从响应体中提取视频URL
function extractFromResponse(responseText) {
    if (!responseText || typeof responseText !== 'string') return;
    // 使用非lookbehind正则（兼容Android 5-7）
    var regex = /(?:['"=])(https?[^'"]*(?:mp4|m3u8)[^'"]*)/gi;
    var match;
    while ((match = regex.exec(responseText)) !== null) {
        if (match[1]) {
            var url = match[1].trim();
            if (isVideoUrl(url)) {
                interceptedVideoUrls.push(url);
            }
        }
    }
}

// 拦截 XMLHttpRequest
var origXHROpen = XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open = function(method, url) {
    this._url = url;
    return origXHROpen.apply(this, arguments);
};

var origXHRSend = XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.send = function() {
    var self = this;
    self.addEventListener('load', function() {
        var url = self._url || self.responseURL || '';
        if (isM3u8Url(url)) {
            interceptedVideoUrls.push(url);
        }
        // 也从响应体中提取
        if (self.responseText) {
            extractFromResponse(self.responseText);
        }
    });
    return origXHRSend.apply(this, arguments);
};

// 拦截 fetch
if (window.fetch) {
    var origFetch = window.fetch;
    window.fetch = function(input, init) {
        var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        if (isM3u8Url(url)) {
            interceptedVideoUrls.push(url);
        }
        return origFetch.apply(this, arguments);
    };
}

// ============================================================
// Legado JSBridge 网络请求
// ============================================================
function fetchPage(url, callback) {
    try {
        // 方式1: 使用 java.ajax() JSBridge
        if (typeof java !== 'undefined' && java.ajax) {
            var response = java.ajax(url);
            callback(response, null);
            return;
        }
    } catch(e) {}

    try {
        // 方式2: 使用 XMLHttpRequest（同源场景）
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                callback(xhr.responseText, null);
            } else {
                callback(null, 'HTTP ' + xhr.status);
            }
        };
        xhr.onerror = function() {
            callback(null, 'Network Error');
        };
        xhr.send();
    } catch(e) {
        callback(null, e.message);
    }
}

// ============================================================
// URL 处理工具
// ============================================================

// URL 去重增强（decodeURIComponent 加 try-catch）
function normalizeUrl(str) {
    if (!str) return '';
    str = str.trim();
    try { str = decodeURIComponent(str); } catch(e) {}
    // 移除首尾引号
    if ((str.charAt(0) === '"' && str.charAt(str.length - 1) === '"') ||
        (str.charAt(0) === "'" && str.charAt(str.length - 1) === "'")) {
        str = str.substring(1, str.length - 1);
    }
    return str;
}

// 判断是否为视频URL（排除广告后缀黑名单）
function isVideoUrl(url) {
    if (!url || typeof url !== 'string') return false;
    var lower = url.toLowerCase();
    // 检查是否包含视频格式关键字
    var hasVideoKeyword = lower.indexOf('.m3u8') !== -1 ||
                          lower.indexOf('.mp4') !== -1 ||
                          lower.indexOf('.flv') !== -1 ||
                          lower.indexOf('.mkv') !== -1 ||
                          lower.indexOf('.avi') !== -1 ||
                          lower.indexOf('.mov') !== -1 ||
                          lower.indexOf('.webm') !== -1 ||
                          lower.indexOf('.ts') !== -1;
    if (!hasVideoKeyword) return false;

    // 检查广告后缀黑名单（仅当URL以这些后缀结尾时排除）
    for (var i = 0; i < config.adExtensionBlacklist.length; i++) {
        if (lower.indexOf(config.adExtensionBlacklist[i]) !== -1) {
            // 如果URL以黑名单后缀结尾且不包含m3u8，则排除
            // 但m3u8格式的URL即使包含黑名单后缀路径也保留
            if (lower.indexOf('.m3u8') === -1) {
                return false;
            }
        }
    }
    return true;
}

// 判断是否为m3u8格式
function isM3u8Format(url) {
    return url.toLowerCase().indexOf('.m3u8') !== -1 || url.toLowerCase().indexOf('m3u8') !== -1;
}

// URL 去重（使用对象+数组替代Set）
function uniqueUrls(arr) {
    var seen = {};
    var result = [];
    for (var i = 0; i < arr.length; i++) {
        var url = arr[i];
        if (!seen[url]) {
            seen[url] = true;
            result.push(url);
        }
    }
    return result;
}

// ============================================================
// 视频提取方法
// ============================================================

// 方法1: DOM 提取（选择器可配置化）
function extractFromDOM(doc) {
    var urls = [];
    var selectors = config.genericSelectors;
    if (config.siteSpecificSelector) {
        selectors = config.siteSpecificSelector + ', ' + selectors;
    }
    try {
        var elements = doc.querySelectorAll(selectors);
        for (var i = 0; i < elements.length; i++) {
            var el = elements[i];
            var src = el.getAttribute('src') || el.getAttribute('data-src') || el.getAttribute('data-url') || '';
            if (src) {
                src = normalizeUrl(src);
                if (isVideoUrl(src)) {
                    urls.push(src);
                }
            }
            // 检查 source 子元素
            var sources = el.querySelectorAll('source');
            for (var j = 0; j < sources.length; j++) {
                var sSrc = sources[j].getAttribute('src') || sources[j].getAttribute('data-src') || '';
                if (sSrc) {
                    sSrc = normalizeUrl(sSrc);
                    if (isVideoUrl(sSrc)) {
                        urls.push(sSrc);
                    }
                }
            }
        }
    } catch(e) {
        addDebug('DOM提取异常: ' + e.message);
    }
    addDebug('方法1(DOM提取)找到 ' + urls.length + ' 个URL');
    return urls;
}

// 方法2: 正则提取（修复Lookbehind，兼容Android 5-7）
function extractFromRegex(html) {
    var urls = [];
    if (!html || typeof html !== 'string') return urls;
    // 使用非lookbehind正则，取match[1]作为结果
    var regex = /(?:['"=])(https?[^'"]*(?:mp4|m3u8)[^'"]*)/gi;
    var match;
    while ((match = regex.exec(html)) !== null) {
        if (match[1]) {
            var url = normalizeUrl(match[1]);
            if (isVideoUrl(url)) {
                urls.push(url);
            }
        }
    }
    addDebug('方法2(正则提取)找到 ' + urls.length + ' 个URL');
    return urls;
}

// 方法3: JS 变量提取
function extractFromJSVars(html) {
    var urls = [];
    if (!html || typeof html !== 'string') return urls;
    // 匹配常见的JS变量赋值模式
    var patterns = [
        /var\s+\w*\s*=\s*["'](https?[^"']*(?:mp4|m3u8)[^"']*)/gi,
        /let\s+\w*\s*=\s*["'](https?[^"']*(?:mp4|m3u8)[^"']*)/gi,
        /const\s+\w*\s*=\s*["'](https?[^"']*(?:mp4|m3u8)[^"']*)/gi,
        /\w+\.url\s*=\s*["'](https?[^"']*(?:mp4|m3u8)[^"']*)/gi,
        /\w+\s*=\s*["'](https?[^"']*\.m3u8[^"']*)/gi,
        /\w+\s*=\s*["'](https?[^"']*\.mp4[^"']*)/gi
    ];
    for (var p = 0; p < patterns.length; p++) {
        var m;
        while ((m = patterns[p].exec(html)) !== null) {
            if (m[1]) {
                var url = normalizeUrl(m[1]);
                if (isVideoUrl(url)) {
                    urls.push(url);
                }
            }
        }
    }
    addDebug('方法3(JS变量提取)找到 ' + urls.length + ' 个URL');
    return urls;
}

// 方法4: XHR/Fetch 拦截提取
function extractFromIntercepted() {
    addDebug('方法4(XHR拦截提取)找到 ' + interceptedVideoUrls.length + ' 个URL');
    return [].concat(interceptedVideoUrls);
}

// 综合提取视频URL
function extractVideoUrls(doc, html) {
    var allUrls = [];

    // 方法1: DOM提取
    var domUrls = extractFromDOM(doc);
    allUrls = allUrls.concat(domUrls);

    // 方法2: 正则提取
    var regexUrls = extractFromRegex(html);
    allUrls = allUrls.concat(regexUrls);

    // 方法3: JS变量提取
    var jsUrls = extractFromJSVars(html);
    allUrls = allUrls.concat(jsUrls);

    // 方法4: XHR拦截提取
    var interceptedUrls = extractFromIntercepted();
    allUrls = allUrls.concat(interceptedUrls);

    // 去重
    allUrls = uniqueUrls(allUrls);

    addMessage('综合提取共找到 ' + allUrls.length + ' 个去重后的视频URL');
    for (var i = 0; i < allUrls.length; i++) {
        addDebug('URL[' + i + ']: ' + allUrls[i]);
    }

    return allUrls;
}

// ============================================================
// 视频加载与播放
// ============================================================

// 跳过片头的命名函数引用（自清除，避免累积）
function onLoadedMetadataForSkip() {
    var ve = document.getElementById('video-element');
    if (ve.duration > config.skipIntroSeconds) {
        ve.currentTime = config.skipIntroSeconds;
        addMessage('✅ 已跳过 ' + config.skipIntroSeconds + ' 秒片头', 'success-message');
    }
    ve.removeEventListener('loadedmetadata', onLoadedMetadataForSkip);
}

// 更新进度条
function updateProgressBar() {
    var videoElement = document.getElementById('video-element');
    var progressBar = document.getElementById('video-progress');
    var bufferProgressBar = document.getElementById('video-buffer-progress');
    if (!videoElement || !progressBar || !videoElement.duration) return;

    var progress = (videoElement.currentTime / videoElement.duration) * 100;
    progressBar.style.width = progress + '%';

    if (bufferProgressBar && videoElement.buffered.length > 0) {
        var bufferedEnd = videoElement.buffered.end(videoElement.buffered.length - 1);
        var bufferProgress = (bufferedEnd / videoElement.duration) * 100;
        bufferProgressBar.style.width = bufferProgress + '%';
    }
}

// 设置HLS.js事件监听
function setupHlsEvents(hlsInstance) {
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
        addMessage('HLS.js: 播放列表解析完成，共' + data.levels.length + '个质量级别', 'success-message');
    });

    hlsInstance.on(Hls.Events.BUFFER_CREATED, function() {
        addMessage('HLS.js: 缓冲创建成功', 'success-message');
    });

    hlsInstance.on(Hls.Events.BUFFER_APPENDING, function(event, data) {
        if (data.frag && data.frag.sn % 10 === 0) {
            addMessage('HLS.js: 正在缓冲片段 ' + data.frag.sn, 'success-message');
        }
    });

    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
        if (data.fatal) {
            switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                    addMessage('HLS.js: 网络错误，正在重试...', 'error');
                    hlsInstance.startLoad();
                    break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                    addMessage('HLS.js: 媒体错误，正在重试...', 'error');
                    hlsInstance.recoverMediaError();
                    break;
                default:
                    addMessage('HLS.js: 致命错误: ' + data.type, 'error');
                    hlsInstance.destroy();
                    hls = null;
                    break;
            }
        } else {
            addMessage('HLS.js: 非致命错误: ' + data.type + ' - ' + data.details, 'warn');
        }
    });
}

// 加载视频（m3u8/mp4分流，避免双重加载冲突）
function loadVideo(url) {
    var ve = document.getElementById('video-element');

    // 清除旧的事件监听器（防止累积）
    ve.removeEventListener('timeupdate', updateProgressBar);
    ve.removeEventListener('loadedmetadata', updateProgressBar);
    ve.removeEventListener('progress', updateProgressBar);
    ve.removeEventListener('loadedmetadata', onLoadedMetadataForSkip);

    // 清除旧的HLS实例
    if (hls) {
        hls.destroy();
        hls = null;
    }

    ve.muted = true;
    ve.playbackRate = currentPlaybackRate;
    document.getElementById('video-url').textContent = '播放地址：' + url;

    // 根据视频类型分流加载
    if (isM3u8Format(url)) {
        // m3u8格式：优先使用HLS.js，不设直接src避免双重加载冲突
        if (window.Hls && Hls.isSupported()) {
            hls = new Hls(config.hlsJsConfig);
            hls.attachMedia(ve);
            hls.loadSource(url);
            setupHlsEvents(hls);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                ve.play().catch(function(){});
            });
            addMessage('使用缓冲技术: HLS.js (v1.4.12)', 'success-message');
        } else if (ve.canPlayType('application/vnd.apple.mpegurl')) {
            // iOS Safari 等原生支持HLS的环境
            ve.src = url;
            ve.addEventListener('loadedmetadata', function onMeta() {
                ve.removeEventListener('loadedmetadata', onMeta);
                ve.play().catch(function(){});
            });
            addMessage('使用原生HLS播放', 'success-message');
        } else {
            addMessage('❌ 当前设备不支持HLS播放', 'error');
        }
    } else {
        // mp4等普通格式：直接设置src，走原生播放
        ve.src = url;
        ve.play().catch(function(){});
        addMessage('使用原生播放器', 'success-message');
    }

    // 重新添加进度条更新监听器
    ve.addEventListener('timeupdate', updateProgressBar);
    ve.addEventListener('loadedmetadata', updateProgressBar);
    ve.addEventListener('progress', updateProgressBar);

    // 跳过片头
    if (config.skipIntroSeconds > 0) {
        ve.addEventListener('loadedmetadata', onLoadedMetadataForSkip);
    }

    // 根据配置控制description显示状态
    if (config.showDescription) {
        document.getElementById('description').style.display = 'block';
    } else {
        document.getElementById('description').style.display = 'none';
    }
}

// ============================================================
// 分页加载
// ============================================================

// 解析分页信息
function parsePageInfo() {
    var pageInfoText = '{{@@.pager@a.-2@textNodes##\n.*}}';
    if (pageInfoText && pageInfoText.indexOf('{{@@') === -1) {
        var parts = pageInfoText.split('/');
        if (parts.length === 2) {
            currentPage = parseInt(parts[0]) || 1;
            totalPages = parseInt(parts[1]) || 1;
        }
    }
}

// 解析章节列表
function parseChapterList() {
    var hrefs = '{{@@.chapters@a@href}}';
    var texts = '{{@@.chapters@a@text}}';

    if (hrefs && hrefs.indexOf('{{@@') === -1) {
        pageUrls = hrefs.split('\n').filter(function(s) { return s.trim() !== ''; });
    }
    if (texts && texts.indexOf('{{@@') === -1) {
        pageTitles = texts.split('\n').filter(function(s) { return s.trim() !== ''; });
    }

    // 如果没有从模板获取到分页信息，但有章节列表，则用章节数量作为总页数
    if (pageUrls.length > 0 && totalPages <= 1) {
        totalPages = pageUrls.length;
    }
}

// 加载指定页面的视频
function loadPageVideo(pageIndex) {
    if (pageIndex < 0 || pageIndex >= pageUrls.length) {
        addMessage('❌ 页面索引超出范围', 'error');
        return;
    }

    var url = pageUrls[pageIndex];
    if (!url) {
        addMessage('❌ 页面URL为空', 'error');
        return;
    }

    // 处理相对URL
    if (url.indexOf('http') !== 0) {
        var baseUrl = '{{baseUrl}}';
        if (baseUrl && baseUrl.indexOf('{{') === -1) {
            url = baseUrl + (url.charAt(0) === '/' ? '' : '/') + url;
        }
    }

    addMessage('正在加载第 ' + (pageIndex + 1) + ' 页: ' + (pageTitles[pageIndex] || url));

    fetchPage(url, function(html, error) {
        if (error) {
            addMessage('❌ 加载页面失败: ' + error, 'error');
            return;
        }
        if (!html) {
            addMessage('❌ 页面内容为空', 'error');
            return;
        }

        // 解析HTML
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');

        // 提取视频URL
        var urls = extractVideoUrls(doc, html);
        if (urls.length > 0) {
            videoSources = urls;
            updateVideoSourceSelect();
            loadVideo(urls[0]);
        } else {
            addMessage('❌ 第 ' + (pageIndex + 1) + ' 页未找到视频地址', 'error');
        }
    });
}

// 更新视频源选择器
function updateVideoSourceSelect() {
    var select = document.getElementById('video-source-select');
    select.innerHTML = '';

    for (var i = 0; i < videoSources.length; i++) {
        var option = document.createElement('option');
        option.value = i;
        option.textContent = '视频 ' + (i + 1);
        select.appendChild(option);
    }

    // 根据视频数量显示或隐藏视频源切换容器
    if (videoSources.length > 1) {
        document.getElementById('video-source-container').style.display = 'flex';
    } else {
        document.getElementById('video-source-container').style.display = 'none';
    }
}

// 更新视频源
function updateVideoSource() {
    var selectedIndex = parseInt(document.getElementById('video-source-select').value);
    if (isNaN(selectedIndex) || !videoSources[selectedIndex]) {
        addMessage('❌ 未找到有效的视频源', 'error');
        return;
    }
    var selectedSource = videoSources[selectedIndex];
    loadVideo(selectedSource);
    addMessage('更新视频源为: ' + selectedSource);
}

// ============================================================
// 控制功能
// ============================================================

// 快进快退
function skip(sec) {
    var v = document.getElementById('video-element');
    var duration = v.duration || 0;
    var currentTime = v.currentTime || 0;
    var newTime = Math.max(0, Math.min(duration, currentTime + sec));
    v.currentTime = newTime;

    var action = sec > 0 ? '快进' : '后退';
    var absSeconds = Math.abs(sec);
    var timeText = '';
    if (absSeconds === 180) timeText = '3分钟';
    else if (absSeconds === 60) timeText = '1分钟';
    else if (absSeconds === 30) timeText = '30秒';
    else timeText = absSeconds + '秒';

    addMessage('✅ 视频已' + action + ' ' + timeText + '（当前时间：' + Math.round(newTime) + '秒）', 'success-message');
}

// 全屏控制
function toggleFullscreen() {
    var videoElement = document.getElementById('video-element');
    var fullscreenBtn = document.getElementById('fullscreen-btn');

    if (!document.fullscreenElement) {
        if (videoElement.requestFullscreen) {
            videoElement.requestFullscreen();
        } else if (videoElement.mozRequestFullScreen) {
            videoElement.mozRequestFullScreen();
        } else if (videoElement.webkitRequestFullscreen) {
            videoElement.webkitRequestFullscreen();
        } else if (videoElement.msRequestFullscreen) {
            videoElement.msRequestFullscreen();
        }
        fullscreenBtn.textContent = '退出全屏';
        addMessage('已进入全屏模式');
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.mozCancelFullScreen) {
            document.mozCancelFullScreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
        fullscreenBtn.textContent = '全屏';
        addMessage('已退出全屏模式');
    }
}

// 监听全屏状态变化
function onFullscreenChange() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreen && !document.msFullscreenElement) {
        document.getElementById('fullscreen-btn').textContent = '全屏';
    }
}

// 视频反转控制（横竖屏切换）
function toggleRotation() {
    var videoWrapper = document.getElementById('video-wrapper');
    var videoElement = document.getElementById('video-element');
    var rotateBtn = document.getElementById('rotate-btn');

    currentRotation = (currentRotation + 90) % 360;
    videoWrapper.style.transform = 'rotate(' + currentRotation + 'deg)';

    if (currentRotation === 90 || currentRotation === 270) {
        videoWrapper.style.width = 'auto';
        videoWrapper.style.height = '100vw';
        videoWrapper.style.maxHeight = '60vh';
        videoElement.style.width = 'auto';
        videoElement.style.height = '100%';
    } else {
        videoWrapper.style.width = '100%';
        videoWrapper.style.height = 'auto';
        videoWrapper.style.maxHeight = '';
        videoElement.style.width = '100%';
        videoElement.style.height = 'auto';
    }

    var rotationText = currentRotation === 0 ? '正常' :
                       currentRotation === 90 ? '横屏' :
                       currentRotation === 180 ? '倒置' : '横屏';
    rotateBtn.textContent = rotationText;
    addMessage('视频已旋转至 ' + currentRotation + '° (' + rotationText + '模式)', 'success-message');
}

// ============================================================
// 消息与调试
// ============================================================

function addMessage(text, className) {
    var messagesDiv = document.getElementById('messages');
    var messageElement = document.createElement('div');
    if (className) {
        messageElement.className = className;
    }
    messageElement.textContent = text;
    messagesDiv.appendChild(messageElement);
    messagesDiv.appendChild(document.createElement('br'));
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function addDebug(text) {
    var debugDiv = document.getElementById('debug-info');
    var debugElement = document.createElement('div');
    debugElement.textContent = text;
    debugDiv.appendChild(debugElement);
    debugDiv.appendChild(document.createElement('br'));
    debugDiv.scrollTop = debugDiv.scrollHeight;
}

// ============================================================
// 事件绑定
// ============================================================

function setupEventListeners() {
    // 快进快退按钮
    document.getElementById('skip-3m').onclick = function() { skip(-180); };
    document.getElementById('skip-1m').onclick = function() { skip(-60); };
    document.getElementById('skip-30s').onclick = function() { skip(-30); };
    document.getElementById('skip-plus30s').onclick = function() { skip(30); };
    document.getElementById('skip-plus1m').onclick = function() { skip(60); };
    document.getElementById('skip-plus3m').onclick = function() { skip(180); };

    // 倍速播放控制
    document.getElementById('playback-rate-select').onchange = function() {
        currentPlaybackRate = parseFloat(this.value);
        document.getElementById('video-element').playbackRate = currentPlaybackRate;
        addMessage('视频倍速已设置为: ' + currentPlaybackRate + 'x');
    };

    // 全屏按钮
    document.getElementById('fullscreen-btn').onclick = toggleFullscreen;

    // 反转按钮
    document.getElementById('rotate-btn').onclick = toggleRotation;

    // 视频源选择器
    document.getElementById('video-source-select').onchange = updateVideoSource;

    // 上一集按钮
    document.getElementById('prev-video-btn').onclick = function() {
        var currentVideoIndex = parseInt(document.getElementById('video-source-select').value);
        if (!isNaN(currentVideoIndex) && currentVideoIndex > 0) {
            document.getElementById('video-source-select').value = currentVideoIndex - 1;
            updateVideoSource();
        }
    };

    // 下一集按钮
    document.getElementById('next-video-btn').onclick = function() {
        var currentVideoIndex = parseInt(document.getElementById('video-source-select').value);
        if (!isNaN(currentVideoIndex) && currentVideoIndex < videoSources.length - 1) {
            document.getElementById('video-source-select').value = currentVideoIndex + 1;
            updateVideoSource();
        }
    };

    // 全屏状态监听
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('mozfullscreenchange', onFullscreenChange);
    document.addEventListener('MSFullscreenChange', onFullscreenChange);

    // 显/隐信息按钮
    document.getElementById('toggle-messages-btn').onclick = function() {
        var messagesDiv = document.getElementById('messages');
        messagesDiv.style.display = messagesDiv.style.display === 'none' ? 'block' : 'none';
    };

    // 调试信息按钮
    document.getElementById('toggle-debug-btn').onclick = function() {
        var debugDiv = document.getElementById('debug-info');
        debugDiv.style.display = debugDiv.style.display === 'none' ? 'block' : 'none';
    };

    // 分页控制
    document.getElementById('prev-page-btn').onclick = function() {
        if (currentPage > 1) {
            currentPage--;
            loadPageVideo(currentPage - 1);
            updatePageInfo();
        }
    };

    document.getElementById('next-page-btn').onclick = function() {
        if (currentPage < totalPages) {
            currentPage++;
            loadPageVideo(currentPage - 1);
            updatePageInfo();
        }
    };

    document.getElementById('auto-load-btn').onclick = function() {
        config.autoLoad = !config.autoLoad;
        this.textContent = config.autoLoad ? '自动加载' : '手动加载';
        addMessage('已切换为' + (config.autoLoad ? '自动' : '手动') + '加载模式');
    };
}

// 更新分页信息显示
function updatePageInfo() {
    document.getElementById('page-info').textContent = currentPage + '/' + totalPages;
}

// ============================================================
// 初始化
// ============================================================

function init() {
    // 设置事件监听器
    setupEventListeners();

    // 解析分页信息
    parsePageInfo();
    parseChapterList();

    // 显示分页控制
    if (pageUrls.length > 1 || totalPages > 1) {
        document.getElementById('page-controls').style.display = 'flex';
        updatePageInfo();
    }

    // 获取当前页面HTML
    var currentHtml = document.documentElement.outerHTML;

    // 综合提取视频URL（包含四种方法）
    var urls = extractVideoUrls(document, currentHtml);

    if (urls.length > 0) {
        videoSources = urls;
        updateVideoSourceSelect();

        if (config.autoLoad) {
            // 自动加载第一个视频
            loadVideo(urls[0]);
            addMessage('✅ 自动加载视频成功', 'success-message');
        } else {
            addMessage('手动加载模式，请选择视频源后点击播放');
        }
    } else {
        // 当前页面未找到视频，尝试从分页URL加载
        if (pageUrls.length > 0) {
            addMessage('当前页面未找到视频，尝试从章节列表加载...');
            loadPageVideo(0);
        } else {
            addMessage('❌ 未找到任何视频地址，请检查页面或配置', 'error');
        }
    }

    // 根据配置控制description显示状态
    if (config.showDescription) {
        document.getElementById('description').style.display = 'block';
    } else {
        document.getElementById('description').style.display = 'none';
    }
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', init);
</script>
