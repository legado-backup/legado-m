# Robolectric 全局配置（NEW-14 修复）
#
# 为什么必须显式指定 application：
#   全套件跑在同一 JVM，`AppConfig` 的 `<clinit>` 直接读 `appCtx`（splitties）。
#   若某个 Robolectric 测试用**裸 Application**（`@Config(application = Application::class)`）并触达
#   `AppConfig`，注入不发生 ⇒ 抛 IllegalStateException，JVM 缓存该失败 ⇒ 之后所有触达变成
#   `NoClassDefFoundError: Could not initialize class io.legado.app.help.config.AppConfig`（不可逆）。
#   实测（2026-10-15）：新增测试类改变类扫描顺序后，`BookshelfSnapshotStoreTest`（13 例）与
#   `BadgeViewThemeModeTest`（7 例）全红，而隔离运行全绿 ⇒ 与产品代码无关的"运气型绿灯"。
#
#   这里改用**测试专用 Application** `TestLegadoApp`（`src/test` 内），它在 `onCreate` 里先
#   `injectAsAppCtx()` 再 `super.onCreate()` ⇒ 注入发生在**任何测试类之前**，与执行顺序无关
#   （生产 `App` 靠 App Startup 注入，而 Robolectric 不跑 App Startup）。
#   （单个测试类仍可用 `@Config(application = ...)` 覆盖本默认值。）
application=io.legado.app.TestLegadoApp
