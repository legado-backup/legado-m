# BUILD-B-02: armv8 单架构 CI 工作流
# 用途：仅构建 arm64-v8a 单架构 APK，加速 CI 构建速度（约 50% 时间节省）
# 触发：手动 workflow_dispatch 或 push 到 master 时自动触发
# 验证：构建产物为 legado_miss_app_*.apk，仅含 arm64-v8a 架构

name: Build armv8 Only

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'modules/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build armv8 Only APK
        run: |
          chmod +x gradlew
          # BUILD-B-02: 通过 -Pabi=arm64-v8a 注入单架构，跳过 armeabi-v7a 构建
          ./gradlew assembleAppDebug -Pabi=arm64-v8a --build-cache --parallel --daemon --warning-mode all

      - name: Organize the Files
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          cp -rf ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk ${{ github.workspace }}/apk/

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado_armv8_debug
          path: ${{ github.workspace }}/apk/*.apk
          retention-days: 14
