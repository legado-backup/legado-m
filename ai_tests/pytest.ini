[pytest]
# ai_tests 单元测试配置
# 运行方式（项目根目录）：
#   ai_tests\venv\Scripts\python.exe -m pytest ai_tests/tests -q
# 或（ai_tests 目录下）： ai_tests\venv\Scripts\python.exe -m pytest -q
testpaths = tests
# lib.case_parser.TestCase 是业务 dataclass，非测试类，忽略误收集警告
filterwarnings =
    ignore::pytest.PytestCollectionWarning
